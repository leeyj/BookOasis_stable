      - heading "One library is all you need" [level=2] [ref=e91]
      - paragraph [ref=e92]: From scanning to reading, organizing, and extending. Core features live in the core; everything else is open to plugins.
    - generic [ref=e93]:
      - generic [ref=e94]:
        - heading "Auto-scan & organize" [level=3] [ref=e99]
        - paragraph [ref=e100]: Periodically scans your folders to detect new books and fills in covers and metadata automatically. Keeps your library organized by category and series.
      - generic [ref=e101]:
        - heading "Many formats" [level=3] [ref=e108]
        - paragraph [ref=e109]: Read EPUB, PDF, comics (CBZ), and text novels seamlessly in a single viewer.
      - generic [ref=e110]:
        - heading "Plugin ecosystem" [level=3] [ref=e115]
        - paragraph [ref=e116]: Extend through standard contracts, from metadata providers to widgets and context menus. 47 community plugins are currently registered.
      - generic [ref=e117]:
        - heading "SQLite or MariaDB" [level=3] [ref=e123]
        - paragraph [ref=e124]: Keep a single-user server light with SQLite, or scale large libraries up with MariaDB. Features stay identical when you switch backends.
