      - paragraph [ref=e97]: From scanning to reading, organizing, and extending. Core features live in the core; everything else is open to plugins.
    - generic [ref=e98]:
      - generic [ref=e99]:
        - heading "Auto-scan & organize" [level=3] [ref=e104]
        - paragraph [ref=e105]: Periodically scans your folders to detect new books and fills in covers and metadata automatically. Keeps your library organized by category and series.
      - generic [ref=e106]:
        - heading "Many formats" [level=3] [ref=e113]
        - paragraph [ref=e114]: Read EPUB, PDF, comics (CBZ), and text novels seamlessly in a single viewer.
      - generic [ref=e115]:
        - heading "Plugin ecosystem" [level=3] [ref=e120]
        - paragraph [ref=e121]: Extend through standard contracts, from metadata providers to widgets and context menus. 47 community plugins are currently registered.
      - generic [ref=e122]:
        - heading "SQLite or MariaDB" [level=3] [ref=e128]
        - paragraph [ref=e129]: Keep a single-user server light with SQLite, or scale large libraries up with MariaDB. Features stay identical when you switch backends.
