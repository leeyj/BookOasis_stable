    - generic [ref=f2e101]:
      - generic [ref=f2e102]:
        - heading "자동 스캔 & 정리" [level=3] [ref=f2e107]
        - paragraph [ref=f2e108]: 지정한 폴더를 주기적으로 스캔해 신간을 감지하고, 표지와 메타데이터를 자동으로 채웁니다. 카테고리와 시리즈로 정리된 서재를 유지합니다.
      - generic [ref=f2e109]:
        - heading "다양한 포맷" [level=3] [ref=f2e116]
        - paragraph [ref=f2e117]: EPUB, PDF, 만화(CBZ), 텍스트 소설까지 한 뷰어 안에서 이어서 읽습니다.
      - generic [ref=f2e118]:
        - heading "플러그인 생태계" [level=3] [ref=f2e123]
        - paragraph [ref=f2e124]: 메타데이터 제공자, 위젯, 컨텍스트 메뉴까지 표준 계약으로 확장합니다. 현재 47개의 커뮤니티 플러그인이 등록되어 있습니다.
      - generic [ref=f2e125]:
        - heading "SQLite 또는 MariaDB" [level=3] [ref=f2e131]
        - paragraph [ref=f2e132]: 1인 서버는 SQLite로 가볍게, 대규모 라이브러리는 MariaDB로 확장합니다. 백엔드를 바꿔도 기능은 동일합니다.
