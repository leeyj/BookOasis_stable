      - generic [ref=f3e125]:
        - heading "SQLite 또는 MariaDB" [level=3] [ref=f3e131]
        - paragraph [ref=f3e132]: 1인 서버는 SQLite로 가볍게, 대규모 라이브러리는 MariaDB로 확장합니다. 백엔드를 바꿔도 기능은 동일합니다.
