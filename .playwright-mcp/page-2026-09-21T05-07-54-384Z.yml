    - generic [ref=f3e101]:
      - generic [ref=f3e102]:
        - heading "자동 스캔 & 정리" [level=3] [ref=f3e107]
        - paragraph [ref=f3e108]: 지정한 폴더를 주기적으로 스캔해 신간을 감지하고, 표지와 메타데이터를 자동으로 채웁니다. 카테고리와 시리즈로 정리된 서재를 유지합니다.
      - generic [ref=f3e109]:
        - heading "다양한 포맷" [level=3] [ref=f3e116]
        - paragraph [ref=f3e117]: EPUB, PDF, 만화(CBZ), 텍스트 소설까지 한 뷰어 안에서 이어서 읽습니다.
