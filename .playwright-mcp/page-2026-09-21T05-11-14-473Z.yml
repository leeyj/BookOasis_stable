    - generic [ref=f4e98]:
      - heading "One library is all you need" [level=2] [ref=f4e99]
      - paragraph [ref=f4e100]: From scanning to reading, organizing, and extending. Core features live in the core; everything else is open to plugins.
    - generic [ref=f4e101]:
      - generic [ref=f4e102]:
        - heading "Auto-scan & organize" [level=3] [ref=f4e107]
        - paragraph [ref=f4e108]: Periodically scans your folders to detect new books and fills in covers and metadata automatically. Keeps your library organized by category and series.
      - generic [ref=f4e109]:
        - heading "Many formats" [level=3] [ref=f4e116]
        - paragraph [ref=f4e117]: Read EPUB, PDF, comics (CBZ), and text novels seamlessly in a single viewer.
      - generic [ref=f4e118]:
        - heading "Plugin ecosystem" [level=3] [ref=f4e123]
        - paragraph [ref=f4e124]: Extend through standard contracts, from metadata providers to widgets and context menus. 47 community plugins are currently registered.
      - generic [ref=f4e125]:
        - heading "SQLite or MariaDB" [level=3] [ref=f4e131]
        - paragraph [ref=f4e132]: Keep a single-user server light with SQLite, or scale large libraries up with MariaDB. Features stay identical when you switch backends.
