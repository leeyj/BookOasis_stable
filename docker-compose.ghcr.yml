version: "3.8"

services:
  bookoasis:
    image: ghcr.io/leeyj/bookoasis:stable
    container_name: bookoasis
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "5930:5930"
    volumes:
      - ./db:/app/db
      - ./covers:/app/covers
      - ./cache:/app/cache
      # 듣기 서버 미리 만들기 음성 (관리자 설정 TTS_AUDIO_ROOT 기본값 /app/tts_audio — 볼륨이 아니면 기능이 꺼진다)
      - ./tts_audio:/app/tts_audio
      - ./plugins:/app/plugins
    env_file:
      - .env
    environment:
      - PORT=5930
      - REDIS_URL=redis://redis:6379/0
      - LOG_ARCHIVE_MAX_FILES=10
      - LOG_ARCHIVE_MAX_MB=200
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bookoasis_redis
    restart: unless-stopped
