version: "3.8"

services:
  bookoasis:
    image: ghcr.io/leeyj/bookoasis:stable
    container_name: bookoasis
    restart: unless-stopped
    stop_grace_period: 1m  # 종료 시 DB WAL 체크포인트 및 캐시 Flush 완료를 위한 유예 시간
    ports:
      - "5930:5930"
    volumes:
      # 설정 및 데이터베이스 영구 소장용 바인딩
      - ./db:/app/db
      - ./covers:/app/covers
      - ./cache:/app/cache
      - ./plugins:/app/plugins
    # ── GPU 하드웨어 트랜스코딩을 쓰고 싶다면 아래 중 서버 환경에 맞는 항목의 주석을 해제하세요 ──
    # (기본은 둘 다 비활성화 상태입니다. devices/gpu 설정이 가리키는 장치가 호스트에
    #  실제로 없으면 docker-compose up 자체가 시작 실패하니, 있는 것만 해제하세요.)
    #
    # [Intel iGPU (Iris 등) - VAAPI]
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # [NVIDIA GPU (P600 등) - NVENC. 호스트에 NVIDIA 드라이버 + nvidia-container-toolkit 설치 필요]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    env_file:
      - .env
    environment:
      - PORT=5930
      - REDIS_URL=redis://redis:6379/0
      - LOG_ARCHIVE_MAX_FILES=10
      - LOG_ARCHIVE_MAX_MB=200
      # - TZ=Asia/Seoul  # (옵션) 스캔완료시각 등 DB에 기록되는 모든 타임스탬프의 기준 시간대를 바꿉니다.
      #   주석을 해제하지 않으면 컨테이너는 UTC로 동작하며, 화면에는 브라우저 로컬시간 기준으로
      #   표시되어 실제 시각과 어긋나 보입니다. 자동 스캔 "크론 예약 시각"은 이 값과 무관하게
      #   웹 UI 설정 > 일반 > 시스템 타임존을 따로 따르므로, 시간을 맞추려면 두 곳 모두 서울로 설정하세요.
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bookoasis_redis
    restart: unless-stopped
