version: "3.8"

services:
  bookoasis:
    image: ghcr.io/leeyj/bookoasis:stable
    container_name: bookoasis
    restart: unless-stopped
    stop_grace_period: 1m  # 종료 시 DB WAL 체크포인트 및 캐시 Flush 완료를 위한 유예 시간
    ports:
      - "5930:5930"
    volumes:
      # 설정 및 데이터베이스 영구 소장용 바인딩
      - ./db:/app/db
      - ./covers:/app/covers
      - ./cache:/app/cache
      - ./plugins:/app/plugins
    # ── GPU 하드웨어 트랜스코딩을 쓰고 싶다면 아래 중 서버 환경에 맞는 항목의 주석을 해제하세요 ──
    # (기본은 둘 다 비활성화 상태입니다. devices/gpu 설정이 가리키는 장치가 호스트에
    #  실제로 없으면 docker-compose up 자체가 시작 실패하니, 있는 것만 해제하세요.)
    #
    # [Intel iGPU (Iris 등) - VAAPI]
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # [NVIDIA GPU (P600 등) - NVENC. 호스트에 NVIDIA 드라이버 + nvidia-container-toolkit 설치 필요]
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    env_file:
      - .env
    environment:
      - PORT=5930
      - REDIS_URL=redis://redis:6379/0
      - LOG_ARCHIVE_MAX_FILES=10
      - LOG_ARCHIVE_MAX_MB=200
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bookoasis_redis
    restart: unless-stopped
      # - TZ=Asia/Seoul  # (옵션) 컨테이너 로그 및 내부 콘솔 시간대를 정렬하려면 주석을 해제하세요. (웹 서비스의 스케줄 크론 주기는 컨테이너 타임존 대신 웹 UI 일반설정의 타임존 설정을 우선 추종합니다.)
