# fly.toml app configuration file for bo-plugin-relay
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bo-plugin-relay'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  RELAY_DB_PATH = '/data/plugin_relay.db'

[[mounts]]
  source = 'plugin_relay_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
