<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Data Relay - 개발자 계정 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .form-control {
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #2563eb;
            box-shadow: none;
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
        }
        .btn-primary:hover {
            background-color: #3b82f6;
        }
        .secret-box {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <div class="text-center mb-4">
            <i class="bi bi-person-badge-fill text-info display-4 mb-2"></i>
            <h4 class="fw-bold">개발자 계정 등록</h4>
            <p class="text-muted small">플러그인을 등록하려면 먼저 개발자 계정이 필요합니다.</p>
        </div>

        <div id="alertBox"></div>

        <form id="signupForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">Developer ID</label>
                <input type="text" class="form-control" id="developerId" placeholder="예: leeyj_dev (영문/숫자/밑줄, 31자 이내)" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="bi bi-check-circle me-1"></i>등록
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/register" class="text-info small">개발자 계정이 있으신가요? 플러그인 등록하러 가기 &rarr;</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = '';

            const developerId = document.getElementById('developerId').value.trim();
            const res = await fetch('/regi_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ developer_id: developerId }),
            });
            const data = await res.json();

            if (data.success) {
                alertBox.innerHTML = `
                    <div class="alert alert-success small">
                        <div class="fw-bold mb-2"><i class="bi bi-check-circle-fill me-1"></i>등록 완료! developer_secret은 지금만 표시되니 반드시 저장하세요.</div>
                        <div class="secret-box">${data.developer_secret}</div>
                    </div>`;
            } else {
                alertBox.innerHTML = `<div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-triangle-fill me-1"></i>${data.message}</div>`;
            }
        });
    </script>
</body>
</html>
