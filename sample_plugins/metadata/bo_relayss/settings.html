<!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="bo-settings-card">
    <div class="bo-settings-header">
        <i class="bi bi-gear-fill"></i> bo.relaySS 플러그인 환경설정
    </div>

    <form id="boRelayssSettingsForm">
        <!-- 1) 사용자 식별코드 -->
        <div class="bo-settings-field">
            <label for="relayssUserId" class="bo-field-label">1. 사용자 식별코드 (아이디)</label>
            <input type="text" class="bo-field-input" id="relayssUserId" placeholder="예: user_oasis_01" required>
            <div class="bo-field-help">bo.relaySS 서비스에서 사용자를 식별할 고유 아이디를 입력하세요.</div>
        </div>

        <!-- 2) 북오아시스 / bo.relaySS 도메인 주소 -->
        <div class="bo-settings-field">
            <label for="relayssDomainUrl" class="bo-field-label">2. bo.relaySS 도메인 주소</label>
            <input type="url" class="bo-field-input" id="relayssDomainUrl" value="https://bo-relayss.fly.dev" placeholder="https://bo-relayss.fly.dev" required>
            <div class="bo-field-help">배포된 bo.relaySS (Fly.io/GCP) 중계 서버의 URL 주소를 입력하세요.</div>
        </div>

        <!-- 3) 32자리 랜덤 코드 생성 -->
        <div class="bo-settings-field">
            <label for="relayssSecretToken" class="bo-field-label">3. 32자리 인증 토큰 (랜덤 코드)</label>
            <div class="bo-input-btn-group">
                <input type="text" class="bo-field-input bo-token-input" id="relayssSecretToken" readonly placeholder="[생성] 버튼을 눌러 토큰을 발급받으세요.">
                <button class="bo-btn bo-btn-gen" type="button" id="btnGenerateToken">
                    <i class="bi bi-arrow-repeat"></i> 생성
                </button>
            </div>
            <div class="bo-field-help">사용자 식별코드 및 도메인 주소 입력 후 [생성] 버튼을 누르면 32자리 인증 토큰이 생성됩니다.</div>
        </div>

        <!-- 4) bo.relaySS 접속 테스트 & 상태 표시 -->
        <div class="bo-settings-footer">
            <button type="button" class="bo-btn bo-btn-test" id="btnTestConnection">
                <i class="bi bi-plug-fill"></i> bo.relaySS 접속 테스트
            </button>
            <div id="connectionStatusBadge" class="bo-status-badge status-init">
                <i class="bi bi-question-circle"></i> 접속 미확인
            </div>
        </div>
    </form>
</div>
