<!-- 상단 헤더: [검색] [서재 선택 ▾] … [알림] [환경설정] [계정]
     목록에만 의미 있는 제목·건수·카테고리 정보·정렬·필터·기본|작가별은 책 목록 화면 제목 줄
     (views/library_grid.html .library-list-toolbar)로 옮겼다 (2026-10-22, 상단 아이콘이 너무 많다는 의견).
     view_manager.js의 switchActiveView()가 설정/플러그인 화면에서 검색·알림을 숨기지만,
     이 헤더 자체와 서재 선택·환경설정·계정은 모든 뷰에서 항상 보인다. -->
<div class="library-header">
    <!-- 모바일 전용 햄버거(좌측 드로어 열기): 모바일은 로고 앱바 없이 이 헤더 카드 한 장이 앱바 역할을 한다(2026-10-01).
         데스크톱에선 sidebar_manager.js syncSidebarResponsiveControls가 숨긴다 -->
    <button id="btn-sidebar-toggle" class="btn-sidebar-toggle" aria-expanded="false" aria-controls="sidebar-collapsible-content" data-i18n-title="sidebar.open_menu" title="메뉴" style="display: none; background: transparent; border: none; color: var(--app-text-primary); font-size: 1.25rem; cursor: pointer; padding: 0.2rem 0.5rem; outline: none;">
        <i class="lc lc-menu"></i>
        <!-- 스크롤하면 스캔활동 아이콘 줄이 접히므로, 진행 중 표시 점을 햄버거에도 띄운다 -->
        <span class="drawer-scan-dot" data-role="scan-activity-mirror" aria-hidden="true"></span>
    </button>



    <div class="library-search-box library-search-center">
        <input type="text" id="library-search" data-role="library-search-input" class="form-control input-sm" enterkeyhint="search" placeholder="제목, 시리즈, 작가 검색...">
        <button id="btn-library-search-detail" data-role="library-search-detail" class="btn-search-icon btn-search-detail" style="display: none;"
            data-i18n-title="search_overlay.open_detail" title="결과 상세 보기 (Enter)">
            <i class="lc lc-table-properties" aria-hidden="true"></i>
            <span data-i18n="search_overlay.open_detail" class="sr-only">결과 상세 보기</span>
        </button>
        <button id="btn-library-search-action" data-role="library-search-action" class="btn-search-icon"
            data-i18n-title="common.search" title="검색">
            <i class="lc lc-search" aria-hidden="true"></i>
            <span data-i18n="common.search" class="sr-only">검색</span>
        </button>
    </div>

    <!-- 서재(세션) 선택: 누르면 서재 전환 팝업(#mobile-session-menu). 예전엔 폰 전용이고 PC는 서재 탭 4개였다.
         아이콘·라벨은 sidebar_manager.js initMobileSessionMenu가 숨긴 서재 탭(원본)에서 복제해 채운다 -->
    <button id="btn-mobile-session-select" class="mobile-session-select" type="button"
        aria-haspopup="true" aria-expanded="false" aria-controls="mobile-session-menu" hidden>
        <i class="mobile-session-select-icon" aria-hidden="true"></i>
        <span class="mobile-session-select-label"></span>
        <i class="lc lc-chevron-down" aria-hidden="true"></i>
    </button>

    <!-- 라이브러리 타입(세션) 탭: 화면엔 숨기고(PC·폰 모두) 원본으로만 쓴다 - 위 서재 선택 버튼과 팝업이
         이 탭의 라벨·아이콘·권한별 노출(style.display)·선택 상태(.active)를 복제한다 (sidebar_manager.js).
         다른 코드가 .active/표시 여부를 이 탭에 계속 기록하므로 DOM은 유지한다 -->
    <div id="library-type-toggle-group" class="library-toggle-group">
        <button class="btn-toggle btn-toggle--session active" id="btn-lib-general" data-role="library-type-toggle" data-library-type="general" title="일반 도서" data-i18n-title="header.general_books"><i class="lc lc-book-open" aria-hidden="true"></i><span class="btn-toggle-label" data-i18n="header.general_books">일반 도서</span></button>
        <button class="btn-toggle btn-toggle--session" id="btn-lib-adult" data-role="library-type-toggle" data-library-type="adult" title="성인 도서" data-i18n-title="header.adult_books"><i class="lc lc-book-lock" aria-hidden="true"></i><span class="btn-toggle-label" data-i18n="header.adult_books">성인 도서</span></button>
        <button class="btn-toggle btn-toggle--session" id="btn-lib-audiobook" data-role="library-type-toggle" data-library-type="audiobook" title="오디오북" data-i18n-title="header.audiobooks"><i class="lc lc-headphones" aria-hidden="true"></i><span class="btn-toggle-label" data-i18n="header.audiobooks">오디오북</span></button>
        <button class="btn-toggle btn-toggle--session" id="btn-lib-video" data-role="library-type-toggle" data-library-type="video" title="영상 강좌" data-i18n-title="header.videos"><i class="lc lc-monitor-play" aria-hidden="true"></i><span class="btn-toggle-label" data-i18n="header.videos">영상 강좌</span></button>
    </div>

    <!-- 오른쪽 끝 액션 묶음: 상황별(알림)과 상시(환경설정/계정) 그룹이 서로 떨어지지 않도록
         하나의 컨테이너로 감싸서 이 컨테이너 자체만 오른쪽 끝으로 민다(margin-left:auto는 여기 한 곳에만) -->
    <div class="library-header-actions">
    <!-- 알림(스캔 활동): 설정/플러그인 화면에선 숨김(view_manager.js) -->
    <div class="library-controls">
        <div class="scan-activity-wrap">
            <button id="btn-scan-activity" class="btn-scan-activity" type="button"
                aria-label="알림" aria-expanded="false" aria-controls="scan-activity-popover" data-i18n-title="notify.title"
                title="알림" data-i18n-title="header.notifications">
                <i class="lc lc-bell" aria-hidden="true"></i>
                <span id="scan-activity-indicator" class="scan-activity-indicator" aria-hidden="true"></span>
            </button>
            <section id="scan-activity-popover" class="scan-activity-popover" hidden aria-live="polite">
                <header class="scan-activity-header">
                    <div>
                        <strong data-i18n="notify.title">알림</strong>
                        <span id="scan-activity-summary">대기 중</span>
                    </div>
                    <button id="btn-clear-notifications" class="scan-activity-clear" type="button" hidden
                        data-i18n="notify.clear" data-i18n-title="notify.clear_hint" title="완료 기록을 지우고 참고 알림을 '알고 있음'으로 둡니다">지우기</button>
                    <button id="btn-close-scan-activity" type="button" aria-label="닫기" title="닫기" data-i18n-title="common.close">
                        <i class="lc lc-x" aria-hidden="true"></i>
                    </button>
                </header>
                <div id="scan-activity-list" class="scan-activity-list">
                    <div class="scan-activity-empty">
                        <i class="lc lc-bell" aria-hidden="true"></i>
                        <span data-i18n="notify.empty">새 알림이 없습니다.</span>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 환경설정/계정: 어떤 뷰에서도 숨기지 않는 상시 그룹 (view_manager.js가 .library-controls는 숨겨도 이 그룹은 건드리지 않음) -->
    <div class="library-controls-persistent">
        <!-- 환경설정: 사이드바 하단에 있던 항목을 상단 아이콘으로 이동 (사이드바 클릭 위임 로직 재사용) -->
        <button id="category-settings" class="btn-header-icon" data-role="sidebar-category-static" data-category-id="settings"
            data-i18n-title="sidebar.settings" title="환경설정">
            <i class="lc lc-settings" aria-hidden="true"></i>
            <span data-i18n="sidebar.settings" class="sr-only">환경설정</span>
        </button>

        <!-- 계정: 사이드바 하단의 사용자 프로필/로그아웃을 상단 아이콘 + 팝오버로 이동 -->
        <div class="account-menu-wrap">
            <button id="btn-account-menu" class="btn-header-icon" type="button"
                aria-label="계정 메뉴" aria-expanded="false" aria-controls="account-menu-popover" title="계정" data-i18n-title="header.account">
                <i class="lc lc-circle-user" aria-hidden="true"></i>
            </button>
            <section id="account-menu-popover" class="account-menu-popover" hidden aria-live="polite">
                <div class="account-menu-user">
                    <i class="lc lc-circle-user" aria-hidden="true"></i>
                    <span id="session-username-display">-</span>
                </div>
                <!-- KOReader 진행 동기화(kosync): 동기화 비밀번호 설정 - static/js/kosync_settings.js -->
                <button type="button" id="btn-kosync-settings" class="account-menu-item" aria-expanded="false" aria-controls="kosync-settings-panel">
                    <i class="lc lc-book-open-text" aria-hidden="true"></i>
                    <span data-i18n="header.kosync_title">KOReader 동기화</span>
                    <span id="kosync-status-badge" class="kosync-status-badge" data-i18n="header.kosync_on" hidden>켜짐</span>
                </button>
                <div id="kosync-settings-panel" class="kosync-settings" hidden>
                    <div class="kosync-row"><span data-i18n="header.kosync_server">서버</span><code id="kosync-server-url">-</code></div>
                    <div class="kosync-row"><span data-i18n="header.kosync_username">사용자명</span><code id="kosync-username">-</code></div>
                    <input type="password" id="kosync-password" class="kosync-input" placeholder="동기화 비밀번호 (4자 이상)" data-i18n-placeholder="header.kosync_password_placeholder" autocomplete="new-password">
                    <div class="kosync-actions">
                        <button type="button" id="btn-kosync-save" class="kosync-btn kosync-btn-primary" data-i18n="collections.save">저장</button>
                        <button type="button" id="btn-kosync-clear" class="kosync-btn" data-i18n="header.kosync_clear" hidden>해제</button>
                    </div>
                    <p id="kosync-message" class="kosync-message" aria-live="polite"></p>
                    <p class="kosync-hint" data-i18n="header.kosync_hint">KOReader → 진행 상황 동기화 → 사용자 지정 동기화 서버에 위 서버 주소, 로그인에 사용자명과 이 비밀번호를 넣으세요. BookOasis 로그인 비밀번호와 따로 정합니다. OPDS로 내려받은 책이 동기화됩니다.</p>
                </div>
                <a href="/logout" data-i18n-title="sidebar.logout_title" title="로그아웃" class="account-menu-logout">
                    <i class="lc lc-power" aria-hidden="true"></i>
                    <span data-i18n="sidebar.logout_title">로그아웃</span>
                </a>
            </section>
        </div>
    </div>
    </div>
</div>
