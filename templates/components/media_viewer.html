<!-- 내장 미디어 통합 뷰어 모달 (뷰어는 전체화면이 필요하므로 유지) -->
<div id="media-viewer-modal" class="viewer-modal">
    <!-- 전체화면 탈출용 플로팅 닫기 버튼 -->
    <button class="floating-close-btn" data-role="viewer-action" data-action="close" data-i18n-title="viewer.close_fullscreen" title="전체화면 닫기 (ESC)" style="display: none;">
        <i class="lc lc-x"></i>
    </button>

    <div class="viewer-header">

        <!-- data-i18n을 달면 번역 재적용 때 열린 책 제목이 "독서 중..."으로 덮인다 (문제 신고 등이 이 글자를 읽음) -->
        <span class="viewer-title" id="viewer-title-text">독서 중...</span>
        <div class="viewer-controls">
            <!-- 텍스트 뷰어용 폰트 제어판 -->
            <div id="txt-controls" class="txt-controls-panel" style="display:none;">
                <button data-role="viewer-action" data-action="font-size" data-value="-1" class="btn-txt-ctrl">A-</button>
                <button data-role="viewer-action" data-action="font-size" data-value="1" class="btn-txt-ctrl">A+</button>
                <button data-role="viewer-action" data-action="toggle-reader-theme" class="btn-txt-ctrl"><i class="lc lc-contrast"></i></button>
            </div>
            <!-- 만화 뷰어용 화면 맞추기 토글 -->
            <div id="comic-fit-controls" class="comic-fit-panel" style="display:none;">
                <button id="btn-fit-height" class="btn-fit active" data-role="viewer-action" data-action="comic-fit" data-value="height" data-i18n-title="viewer.fit_height" title="높이에 맞추기">
                    <i class="lc lc-move-vertical"></i> <span data-i18n="viewer.height">높이</span>
                </button>
                <button id="btn-fit-width" class="btn-fit" data-role="viewer-action" data-action="comic-fit" data-value="width" data-i18n-title="viewer.fit_width" title="너비에 맞추기">
                    <i class="lc lc-move-horizontal"></i> <span data-i18n="viewer.width">너비</span>
                </button>
            </div>
            <!-- 전체화면 토글 버튼 -->
            <button id="btn-fullscreen-toggle" class="btn-fullscreen" data-role="viewer-action" data-action="toggle-fullscreen" data-i18n-title="viewer.fullscreen" title="전체화면 (F)">
                <i class="lc lc-expand" id="fullscreen-icon"></i>
            </button>
            <span class="close-viewer-btn" data-role="viewer-action" data-action="close">&times;</span>
        </div>

    </div>
    
    <div class="viewer-body" id="viewer-body-container" style="position: relative;">
        <!-- 공통 3분할 투명 핫스팟 터치 레이어 (뷰어 최상단 배치) -->
        <div class="comic-hotspot-layer" id="common-viewer-hotspot" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10002; display: flex; pointer-events: auto;">
            <div class="hotspot-zone left-zone" data-role="viewer-action" data-action="prev-page" data-i18n-title="viewer.prev_page" title="이전 페이지" style="width: 30%; height: 100%; cursor: pointer;"></div>
            <div class="hotspot-zone center-zone" data-role="viewer-action" data-action="toggle-overlay" data-i18n-title="viewer.open_menu" title="메뉴 열기" style="width: 40%; height: 100%; cursor: pointer;"></div>
            <div class="hotspot-zone right-zone" data-role="viewer-action" data-action="next-page" data-i18n-title="viewer.next_page" title="다음 페이지" style="width: 30%; height: 100%; cursor: pointer;"></div>
        </div>

        <!-- Kavita 스타일 플로팅 조작 오버레이 메뉴 (탭 형식 개편 & 푸른색 테마) -->
        <div id="comic-overlay-menu" class="comic-overlay-menu" style="display: none; z-index: 10003;">
            <div class="overlay-header">
                <!-- 전체화면 전환: F11이 없는 태블릿(Windows 포함)·모바일을 위해 메뉴 상단에 항상 둔다.
                     브라우저가 Fullscreen API를 지원할 때만 보임(fullscreen_controller.js가 표시 제어). -->
                <button id="btn-overlay-fullscreen" class="overlay-fullscreen-btn" data-role="viewer-action" data-action="toggle-fullscreen" data-i18n-title="viewer.fullscreen" title="전체화면" style="display: none;">
                    <i class="lc lc-expand" id="overlay-fullscreen-icon"></i>
                </button>
                <!-- 무슨 책인지: 시리즈명 + 권 이름 (책을 열 때 lifecycle_controller.js가 채움).
                     2.6.2에서 탭 줄로 바꾸며 빠졌던 자리 -->
                <div class="overlay-title">
                    <span class="overlay-series" id="overlay-series-text"></span>
                    <span class="overlay-volume" id="overlay-volume-text"></span>
                </div>
                <!-- 탭 네비게이션: 항상 상단에 노출되는 메뉴 버튼들 (예전엔 화면 중앙 카드 안에 있었음) -->
                <div class="overlay-tab-nav">
                    <button class="overlay-tab-btn active" id="tab-btn-nav" data-role="viewer-action" data-action="overlay-tab" data-value="nav">
                        <i class="lc lc-compass"></i> <span data-i18n="viewer.tab_nav">이동</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-layout" data-role="viewer-action" data-action="overlay-tab" data-value="layout">
                        <i class="lc lc-book-open"></i> <span data-i18n="viewer.tab_layout">보기</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-style" data-role="viewer-action" data-action="overlay-tab" data-value="style">
                        <i class="lc lc-type"></i> <span data-i18n="viewer.tab_style">스타일</span>
                    </button>
                    <button class="overlay-tab-btn" id="tab-btn-margin" data-role="viewer-action" data-action="overlay-tab" data-value="margin">
                        <i class="lc lc-move"></i> <span data-i18n="viewer.tab_margin">여백</span>
                    </button>
                </div>
                <button class="overlay-close-btn" data-role="viewer-action" data-action="close" data-i18n-title="viewer.close_fullscreen" title="뷰어 닫기"><i class="lc lc-x"></i></button>
            </div>

            <div class="overlay-controls-panel">
                <!-- 탭 1: 탐색 / 이동 -->
                <div class="overlay-tab-content active" id="overlay-tab-nav">
                    <div class="overlay-controls-row">
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="jump-first"><i class="lc lc-skip-back"></i> <span data-i18n="viewer.from_beginning">처음부터</span></button>
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="mark-completed"><i class="lc lc-circle-check"></i> <span data-i18n="viewer.mark_completed">읽음 완료</span></button>
                        <button class="btn-overlay-action" data-role="viewer-action" data-action="jump-last"><i class="lc lc-skip-forward"></i> <span data-i18n="viewer.to_last_page">마지막으로</span></button>
                        <button class="btn-overlay-action btn-overlay-action-icon-only" id="btn-add-bookmark" data-role="viewer-action" data-action="add-bookmark" data-i18n-title="viewer.add_bookmark" title="북마크 추가"><i class="fa-solid fa-bookmark"></i> <span data-i18n="viewer.menu_bookmark">북마크</span></button>
                        <button class="btn-overlay-action" id="btn-viewer-listen" data-role="viewer-action" data-action="listen" data-i18n-title="tts.viewer_listen_title" title="읽던 위치부터 음성으로 듣기" style="display: none;"><i class="lc lc-headphones"></i> <span data-i18n="tts.viewer_listen">듣기</span></button>
                    </div>
                    <!-- 자동 넘김(슬라이드): 만화/PDF/EPUB/TXT (slideshow_controller.js가 표시/옵션 채움) -->
                    <div class="vm-list overlay-slideshow-row" id="overlay-slideshow-row" style="display: none;">
                        <div class="vm-row">
                            <span class="vm-row-label"><span id="vm-label-autoturn" data-i18n="viewer.menu_autoturn">자동 넘김</span> <kbd class="vm-kbd">P</kbd></span>
                            <button class="vm-switch" id="btn-slideshow-toggle" role="switch" aria-labelledby="vm-label-autoturn" data-role="viewer-action" data-action="slideshow-toggle" data-i18n-title="viewer.slideshow_title" title="자동으로 넘기기/스크롤 (P)"><i class="lc lc-play"></i> <span id="slideshow-toggle-label">자동 넘김</span></button>
                        </div>
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-slideshow-interval-select" data-i18n="viewer.menu_autoturn_interval">넘김 간격 (페이지 모드)</label>
                            <select id="viewer-slideshow-interval-select" data-role="viewer-action-change" data-action="slideshow-interval" class="overlay-select"></select>
                        </div>
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-slideshow-speed-select" data-i18n="viewer.menu_autoturn_speed">스크롤 속도 (스크롤 모드)</label>
                            <select id="viewer-slideshow-speed-select" data-role="viewer-action-change" data-action="slideshow-speed" class="overlay-select"></select>
                        </div>
                    </div>
                </div>

                <!-- 탭 2: 레이아웃 / 보기 방식 — 한 줄에 설정 하나(이름 ... 조작). 버튼 id/data-action은 예전 그대로라
                     reader_settings.js 등이 켜짐(.active)만 바꾸면 스위치/선택지 모양이 따라 바뀐다. -->
                <div class="overlay-tab-content" id="overlay-tab-layout">
                    <div class="vm-list">
                        <div class="vm-row">
                            <span class="vm-row-label" data-i18n="viewer.menu_flow">넘김 방식</span>
                            <div class="vm-seg" id="overlay-scroll-mode-group">
                                <button id="btn-scroll-page" class="btn-overlay-fit active" data-role="viewer-action" data-action="scroll-mode" data-value="page" data-i18n-title="viewer.scroll_page" title="책장처럼 넘기기"><span data-i18n="viewer.page">페이지</span></button>
                                <button id="btn-scroll-continuous" class="btn-overlay-fit" data-role="viewer-action" data-action="scroll-mode" data-value="scroll" data-i18n-title="viewer.scroll_continuous" title="아래로 스크롤"><span data-i18n="viewer.scroll">스크롤</span></button>
                            </div>
                        </div>

                        <!-- 만화 전용 (lifecycle_controller.js가 표시 제어) -->
                        <div class="vm-row" id="overlay-comic-fit-group">
                            <span class="vm-row-label" data-i18n="viewer.menu_fit">화면 맞춤</span>
                            <div class="vm-seg">
                                <button id="btn-overlay-fit-height" class="btn-overlay-fit active" data-role="viewer-action" data-action="comic-fit" data-value="height" data-i18n="viewer.fit_height_label">높이맞춤</button>
                                <button id="btn-overlay-fit-width" class="btn-overlay-fit" data-role="viewer-action" data-action="comic-fit" data-value="width" data-i18n="viewer.fit_width_label">너비맞춤</button>
                            </div>
                        </div>

                        <div class="vm-row">
                            <span class="vm-row-label" id="vm-label-two-page" data-i18n="viewer.menu_two_page">두 쪽 보기</span>
                            <button id="btn-comic-page-step" class="vm-switch" role="switch" aria-labelledby="vm-label-two-page" data-role="viewer-action" data-action="toggle-page-step" title="1장/2장 보기 전환"><span id="comic-page-step-label">1장</span></button>
                        </div>

                        <!-- 2쪽보기 정렬 한 장 밀기: 예) (9,10)(11,12)로 짝지어지던 스프레드를 (10,11)로 보정.
                             2쪽보기일 때만 노출(reader_settings.js의 syncComicPageStepUI가 이 행을 표시 제어). -->
                        <div class="vm-row" id="vm-row-spread-shift" style="display: none;">
                            <span class="vm-row-label" id="vm-label-spread-shift" data-i18n="viewer.menu_spread_shift">두 쪽 짝을 한 장 밀기</span>
                            <button id="btn-spread-shift" class="vm-switch" role="switch" aria-labelledby="vm-label-spread-shift" data-role="viewer-action" data-action="shift-spread" data-i18n-title="viewer.shift_spread_title" title="두 페이지 짝을 한 장 밀어서 보기"></button>
                        </div>

                        <div class="vm-row">
                            <span class="vm-row-label" id="vm-label-split" data-i18n="viewer.menu_split">펼침 이미지 반씩 나눠 보기</span>
                            <button id="btn-comic-split-spread" class="vm-switch" role="switch" aria-labelledby="vm-label-split" data-role="viewer-action" data-action="toggle-split-spread" data-i18n-title="viewer.split_spread_title" title="페이지 분할 보기 전환"><span id="comic-split-spread-label" data-i18n="viewer.split_spread_off">분할 끔</span></button>
                        </div>

                        <div class="vm-row">
                            <span class="vm-row-label" id="vm-label-center-gap" data-i18n="viewer.menu_no_center_gap">두 쪽 보기 가운데 여백 없애기</span>
                            <button id="btn-comic-center-gap" class="vm-switch" role="switch" aria-labelledby="vm-label-center-gap" data-role="viewer-action" data-action="toggle-center-gap" title="2장 보기 중앙 여백 토글"><span id="comic-center-gap-label" data-i18n="viewer.center_gap_show">중앙 여백</span></button>
                        </div>

                        <div class="vm-row">
                            <span class="vm-row-label" id="vm-label-rtl" data-i18n="viewer.menu_rtl">오른쪽에서 왼쪽으로 읽기</span>
                            <button id="btn-comic-reading-direction" class="vm-switch" role="switch" aria-labelledby="vm-label-rtl" data-role="viewer-action" data-action="toggle-reading-direction" title="읽기 방향 전환"><span id="comic-reading-direction-label">왼쪽→오른쪽</span></button>
                        </div>

                        <div class="vm-row">
                            <span class="vm-row-label" id="vm-label-tap-vertical" data-i18n="viewer.menu_tap_vertical">위/아래 탭으로 넘기기</span>
                            <button id="btn-tap-zone-direction" class="vm-switch" role="switch" aria-labelledby="vm-label-tap-vertical" data-role="viewer-action" data-action="toggle-tap-zone-direction" data-i18n-title="viewer.tap_zone_direction" title="탭존 방향 전환 (좌/우 ↔ 상/하)"><span id="tap-zone-direction-label" data-i18n="viewer.tap_zone_horizontal">좌/우</span></button>
                        </div>

                        <!-- 이미지/PDF 너비 조절 슬라이더 (스크롤 모드일 때만 표시) -->
                        <div class="vm-row overlay-width-row" id="overlay-width-row">
                            <label class="vm-row-label overlay-width-label" for="comic-scroll-width-slider" data-i18n="viewer.menu_image_width">이미지 너비</label>
                            <div class="vm-slider">
                                <input
                                    type="range"
                                    id="comic-scroll-width-slider"
                                    class="comic-scroll-width-slider"
                                    min="400"
                                    max="1400"
                                    step="50"
                                    value="800"
                                    data-role="viewer-action-input" data-action="comic-scroll-width"
                                >
                                <span class="overlay-width-value" id="comic-scroll-width-label">800px</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 탭 3: 텍스트 및 EPUB 뷰어 스타일 옵션 (lifecycle_controller.js가 TXT/EPUB일 때만 표시) -->
                <div class="overlay-tab-content" id="overlay-tab-style">
                    <div class="vm-list" id="overlay-txt-controls-row">
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-font-select" data-i18n="viewer.menu_font">글꼴</label>
                            <select id="viewer-font-select" data-role="viewer-action-change" data-action="font-family" class="overlay-select">
                                <option value="gothic">나눔고딕</option>
                                <option value="pretendard">Pretendard</option>
                            </select>
                        </div>
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-theme-select" data-i18n="viewer.menu_theme">배경</label>
                            <select id="viewer-theme-select" data-role="viewer-action-change" data-action="theme" class="overlay-select">
                                <option value="epaper">E-Paper (순백/순검정)</option>
                                <option value="white">화이트 (순백)</option>
                                <option value="sepia">세피아 (미색)</option>
                                <option value="light">라이트 (회색)</option>
                                <option value="dark">다크 (기본)</option>
                                <option value="black">블랙 (OLED)</option>
                            </select>
                        </div>
                        <div class="vm-row">
                            <span class="vm-row-label" data-i18n="viewer.menu_font_size">글자 크기</span>
                            <div class="vm-stepper">
                                <button data-role="viewer-action" data-action="font-size" data-value="-1" data-i18n-title="viewer.font_smaller" title="글자 작게">−</button>
                                <span class="vm-stepper-value" id="vm-font-size-value">100%</span>
                                <button data-role="viewer-action" data-action="font-size" data-value="1" data-i18n-title="viewer.font_larger" title="글자 크게">+</button>
                            </div>
                        </div>
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-line-height-select" data-i18n="viewer.menu_line_height">줄 간격</label>
                            <select id="viewer-line-height-select" data-role="viewer-action-change" data-action="line-height" class="overlay-select">
                                <option value="1.2">1.2</option>
                                <option value="1.4">1.4</option>
                                <option value="1.6">1.6</option>
                                <option value="1.8">1.8</option>
                                <option value="2.0">2.0</option>
                                <option value="2.2">2.2</option>
                            </select>
                        </div>
                        <div class="vm-row">
                            <label class="vm-row-label" for="viewer-paragraph-spacing-select" data-i18n="viewer.menu_paragraph">문단 간격</label>
                            <select id="viewer-paragraph-spacing-select" data-role="viewer-action-change" data-action="paragraph-spacing" class="overlay-select">
                                <option value="0.5">0.5</option>
                                <option value="1.0">1.0</option>
                                <option value="1.5">1.5</option>
                                <option value="2.0">2.0</option>
                                <option value="2.5">2.5</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 탭 4: 여백 상세 조절 (통합 패널) -->
                <div class="overlay-tab-content" id="overlay-tab-margin">
                    <div class="overlay-margin-container">
                        <div class="quick-padding-row">
                            <label><span data-i18n="viewer.margin_top">위 여백</span> <span class="quick-padding-value"><span id="quick-novel-top-val">40</span>px</span></label>
                            <input type="range" id="quick-novel-top-slider" min="0" max="200" step="5" value="40" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="viewer.margin_bottom">아래 여백</span> <span class="quick-padding-value"><span id="quick-novel-bottom-val">60</span>px</span></label>
                            <input type="range" id="quick-novel-bottom-slider" min="0" max="200" step="5" value="60" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="viewer.margin_left">왼쪽 여백</span> <span class="quick-padding-value"><span id="quick-novel-left-val">20</span>px</span></label>
                            <input type="range" id="quick-novel-left-slider" min="0" max="200" step="5" value="20" class="overlay-slider">
                        </div>
                        <div class="quick-padding-row">
                            <label><span data-i18n="viewer.margin_right">오른쪽 여백</span> <span class="quick-padding-value"><span id="quick-novel-right-val">20</span>px</span></label>
                            <input type="range" id="quick-novel-right-slider" min="0" max="200" step="5" value="20" class="overlay-slider">
                        </div>
                    </div>
                </div>
            </div>

            <div class="overlay-footer">
                <!-- 시크바 네비게이션 행 -->
                <div class="seekbar-nav-row">
                    <button class="seekbar-btn" id="seekbar-btn-first" data-role="viewer-action" data-action="jump-first" data-i18n-title="viewer.from_beginning" title="처음으로">
                        <i class="lc lc-skip-back"></i>
                    </button>
                    <div class="seekbar-track-wrap">
                        <span class="seekbar-page-num" id="seekbar-start-label">1</span>
                        <div class="seekbar-slider-container">
                            <div class="seekbar-tooltip" id="seekbar-tooltip">1</div>
                            <input
                                type="range"
                                id="viewer-page-slider"
                                min="1"
                                max="1"
                                value="1"
                                class="seekbar-input"
                            >
                        </div>
                        <span class="seekbar-page-num" id="seekbar-end-label">1</span>
                    </div>
                    <button class="seekbar-btn" id="seekbar-btn-last" data-role="viewer-action" data-action="jump-last" data-i18n-title="viewer.to_last_page" title="마지막으로">
                        <i class="lc lc-skip-forward"></i>
                    </button>
                </div>

                <!-- 현재 페이지 뱃지 -->
                <div class="seekbar-current-badge">
                    <span id="comic-overlay-page-info">1 / 1</span>
                </div>
            </div>
        </div>

        <!-- 뷰어 여백 설정 퀵 조절 패널 -->
        <div id="viewer-padding-overlay-panel" class="viewer-padding-panel" style="display: none; z-index: 10004;">
            <div class="padding-panel-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.5rem; margin-bottom: 0.75rem;">
                <h4 style="margin: 0; color: var(--app-text-primary); font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem;">
                    <i class="lc lc-move" style="color: var(--app-accent);"></i>
                    <span data-i18n="viewer.spacing_settings">뷰어 여백 상세 설정</span>
                </h4>
                <span class="padding-panel-close" data-role="viewer-action" data-action="toggle-padding-panel" style="cursor: pointer; color: var(--app-text-muted); font-size: 1.2rem; font-weight: bold;">&times;</span>
            </div>
            <div class="padding-panel-body">
                <!-- 소설/텍스트 조절 폼 (TXT, EPUB) -->
                <div id="quick-padding-novel-group" style="display: none; flex-direction: column; gap: 0.6rem;">
                    <!-- 1. 상단 여백 -->
                    <div class="quick-padding-row" style="display: flex; flex-direction: column; gap: 0.2rem;">
                        <label style="font-size: 0.76rem; color: var(--app-text-muted); display: flex; justify-content: space-between;"><span data-i18n="settings.padding_top_label">상단 여백</span> <span><span id="quick-novel-top-val">40</span>px</span></label>
                        <input type="range" id="quick-novel-top-slider" min="0" max="200" step="5" value="40" style="width: 100%; cursor: pointer; accent-color: var(--app-accent);">
                    </div>
                    <!-- 2. 하단 여백 -->
                    <div class="quick-padding-row" style="display: flex; flex-direction: column; gap: 0.2rem;">
                        <label style="font-size: 0.76rem; color: var(--app-text-muted); display: flex; justify-content: space-between;"><span data-i18n="settings.padding_bottom_label">하단 여백</span> <span><span id="quick-novel-bottom-val">60</span>px</span></label>
                        <input type="range" id="quick-novel-bottom-slider" min="0" max="200" step="5" value="60" style="width: 100%; cursor: pointer; accent-color: var(--app-accent);">
                    </div>
                    <!-- 3. 좌측 여백 -->
                    <div class="quick-padding-row" style="display: flex; flex-direction: column; gap: 0.2rem;">
                        <label style="font-size: 0.76rem; color: var(--app-text-muted); display: flex; justify-content: space-between;"><span data-i18n="settings.padding_left_label">좌측 여백</span> <span><span id="quick-novel-left-val">20</span>px</span></label>
                        <input type="range" id="quick-novel-left-slider" min="0" max="200" step="5" value="20" style="width: 100%; cursor: pointer; accent-color: var(--app-accent);">
                    </div>
                    <!-- 4. 우측 여백 -->
                    <div class="quick-padding-row" style="display: flex; flex-direction: column; gap: 0.2rem;">
                        <label style="font-size: 0.76rem; color: var(--app-text-muted); display: flex; justify-content: space-between;"><span data-i18n="settings.padding_right_label">우측 여백</span> <span><span id="quick-novel-right-val">20</span>px</span></label>
                        <input type="range" id="quick-novel-right-slider" min="0" max="200" step="5" value="20" style="width: 100%; cursor: pointer; accent-color: var(--app-accent);">
                    </div>
                </div>
            </div>
        </div>

        <!-- 이미지(만화) 뷰어 -->
        <div id="comic-viewer-container" class="viewer-pane" style="display:none; position: relative;">
            <div class="comic-image-wrapper">
                <img id="comic-page-img" src="" alt="Comic Page">
            </div>
        </div>

        <!-- 공통 로딩/에러 오버레이 -->
        <div id="viewer-common-overlay" class="comic-loading-overlay" style="display:none; z-index: 10006;">
            <div class="comic-loading-content">
                <div id="viewer-common-spinner" class="comic-loading-spinner"></div>
                <p id="viewer-common-text" class="comic-loading-text" data-i18n="viewer.downloading">다운로드 중...</p>
                <p id="viewer-common-sub" class="comic-loading-sub" data-i18n="viewer.downloading_sub">Google Drive에서 파일을 가져오고 있습니다.<br>잠시만 기다려 주세요.</p>
                <div id="viewer-common-report" class="viewer-report-row" hidden></div>
                <button id="viewer-common-close-btn" class="btn-overlay-fit" style="display: none; margin-top: 1rem; border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1rem; background: rgba(255,255,255,0.1); color: #f1f5f9; cursor: pointer; border-radius: 4px;" data-role="viewer-action" data-action="close" data-i18n="common.close">닫기</button>
            </div>
        </div>

        <!-- 다음 편 이어서 보기 확인 모달 -->
        <div id="viewer-next-episode-modal" class="comic-loading-overlay" style="display:none; z-index: 10007;">
            <div class="comic-loading-content">
                <p class="comic-loading-text" data-i18n="viewer.episode_finished">현재 편을 다 읽었습니다.</p>
                <p id="viewer-next-episode-title" class="comic-loading-sub" style="color: var(--app-accent); font-weight: bold; font-size: 1.05rem;"><span data-i18n="viewer.next_episode">다음 편: </span><span id="viewer-next-episode-dynamic">...</span></p>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button id="viewer-next-episode-confirm-btn" class="btn-overlay-fit" style="border: 1px solid var(--app-accent); padding: 0.5rem 1.2rem; background: var(--app-accent); color: var(--app-accent-contrast); cursor: pointer; border-radius: 4px; font-weight: bold;" data-i18n="viewer.continue_reading">이어서 보기</button>
                    <button id="viewer-next-episode-cancel-btn" class="btn-overlay-fit" style="border: 1px solid rgba(255,255,255,0.2); padding: 0.5rem 1.2rem; background: rgba(255,255,255,0.1); color: #f1f5f9; cursor: pointer; border-radius: 4px;" data-i18n="common.close">닫기</button>
                </div>
            </div>
        </div>

        <!-- TXT 텍스트 리더 -->
        <div id="txt-viewer-container" class="viewer-pane txt-reader-theme-dark" style="display:none; position: relative;">
            <div id="txt-scroll-wrapper" style="width: 100%; height: 100%; box-sizing: border-box;">
                <div id="txt-content-area" class="txt-content"></div>
            </div>
        </div>

        <!-- PDF 뷰어 (pdf.js) -->
        <div id="pdf-viewer-container" class="viewer-pane" style="display:none; position: relative;">
            <div id="pdf-render-area" class="pdf-area" style="overflow: hidden; height: 100%; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; box-sizing: border-box; padding: 10px;">
                <!-- 동적 캔버스 삽입 -->
            </div>
            <div class="pdf-nav-bar" style="z-index: 10005; display: none;">
                <button data-role="viewer-action" data-action="prev-page" class="btn-nav" data-i18n="common.prev">이전</button>
                <span id="pdf-page-info">1 / 1</span>
                <button data-role="viewer-action" data-action="next-page" class="btn-nav" data-i18n="common.next">다음</button>
            </div>
        </div>
    </div>
</div>
