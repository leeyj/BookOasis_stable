<!-- 구글 드라이브 "복사해오기" 전용 모달 (실험적, DEVELOP=true 전용) -->
<div id="gdrive-copy-modal" class="library-modal" style="display: none;">
    <div class="library-modal-content">
        <div class="library-modal-header">
            <h3>Drive에서 복사해오기 (실험적)</h3>
            <span class="library-modal-close" data-role="gdrive-copy-modal-close">&times;</span>
        </div>
        <form id="gdrive-copy-form">
            <div class="library-form-group">
                <label for="gdrive-copy-form-library">대상 카테고리</label>
                <select id="gdrive-copy-form-library" name="library_id" required>
                    <option value="">카테고리를 선택하세요</option>
                </select>
                <div id="gdrive-copy-form-library-empty" style="display: none; margin-top: 0.4rem; color: #94a3b8; font-size: 0.85rem;">서버사이드 복사 대상 리모트/경로가 설정된 카테고리가 없습니다. 먼저 카테고리 추가/수정 모달에서 설정해 주세요.</div>
                <div id="gdrive-copy-form-library-info" style="display: none; margin-top: 0.4rem; color: #60a5fa; font-size: 0.85rem;"></div>
            </div>
            <div class="library-form-group">
                <label for="gdrive-copy-form-links">구글 드라이브 공유 폴더 링크 (엔터로 여러 개 입력 가능)</label>
                <textarea id="gdrive-copy-form-links" name="source_links" required rows="3" maxlength="8192" placeholder="예: https://drive.google.com/drive/folders/1A2B3C4D5E6F7G8H9I"></textarea>
            </div>

            <div class="library-modal-footer">
                <button type="button" class="btn-cancel" data-role="gdrive-copy-modal-close">취소</button>
                <button type="submit" class="btn-submit" data-role="gdrive-copy-submit">복사 시작</button>
            </div>
        </form>
    </div>
</div>
