<!-- 카테고리 속성(만화/도서/잡지 등) 종류 관리 모달 (관리자 전용) -->
<div id="library-kinds-modal" class="library-modal" style="display: none; z-index: 10002;">
    <div class="library-modal-content" style="max-width: 520px;">
        <div class="library-modal-header">
            <h3 data-i18n="modal.content_kind_manage_title">카테고리 속성 관리</h3>
            <span class="library-modal-close" data-role="library-kinds-close">&times;</span>
        </div>
        <p class="library-kind-help" data-i18n="modal.content_kind_manage_help">기본 속성은 이름만 바꿀 수 있고 삭제할 수 없습니다. 사용 중인 속성은 삭제할 수 없습니다.</p>
        <ul id="library-kinds-list" class="library-kind-list"></ul>
        <form id="library-kinds-add-form" class="library-kind-add-form">
            <input type="text" id="library-kinds-add-code" class="library-kind-input" name="code" maxlength="24" autocomplete="off" required pattern="[a-z][a-z0-9_\-]{0,23}" data-i18n-placeholder="modal.content_kind_code_placeholder" placeholder="코드(영문 소문자, 예: webtoon)">
            <input type="text" id="library-kinds-add-name" class="library-kind-input" name="name" maxlength="25" autocomplete="off" required data-i18n-placeholder="modal.content_kind_name_placeholder" placeholder="이름(예: 웹툰)">
            <button type="submit" data-role="library-kind-add" class="library-kind-btn library-kind-btn--primary" data-i18n="modal.content_kind_add">추가</button>
        </form>
    </div>
</div>
