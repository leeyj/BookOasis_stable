<!-- templates/components/views/library_dashboard.html -->
<div id="library-dashboard-view" style="display: none; flex-direction: column; gap: 0.9rem;">
    <!-- -1. 플러그인 로드 상태 알림 패널 (관리자 전용, 기본 숨김 – JS가 role 확인 후 데이터 채워서 노출) -->
    <div id="plugin-health-panel" class="plugin-health-panel" style="display: none;">
        <div class="plugin-health-panel-summary">
            <i class="fa-solid fa-puzzle-piece plugin-health-panel-icon"></i>
            <span id="plugin-health-panel-summary-text"></span>
            <button type="button" id="plugin-health-panel-toggle" class="plugin-health-panel-toggle" style="display: none;" data-i18n="dashboard.plugin_health_details_toggle">자세히 보기</button>
            <button type="button" id="plugin-health-panel-dismiss" class="plugin-health-panel-dismiss" title="닫기" data-i18n-title="dashboard.plugin_health_dismiss"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="plugin-health-panel-details" class="plugin-health-panel-details" style="display: none;"></div>
    </div>

    <!-- 0. 독서 동기부여 위젯 라인 (Reading Insights) -->
    {% include "components/dashboard_reading_insights.html" %}

    <!-- 위젯 & 최근 읽은 도서 사이 얇은 구분선 -->
    <hr id="dashboard-insights-divider" style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 0.1rem 0;" />

    <!-- 1. 최근 읽은 도서 섹션 -->
    <div class="dashboard-section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
            <h3 class="section-title" style="margin: 0; color: #fff; font-size: 1rem; font-weight: 700;"><i class="fa-solid fa-clock-rotate-left" style="color: #a855f7; margin-right: 0.5rem;"></i> <span id="dashboard-recent-title" data-i18n="dashboard.recent_title">최근 읽은 도서</span><span id="dashboard-recent-title-suffix" style="margin-left: 0.35rem; font-size: 0.82em; font-weight: 500; color: #94a3b8;">(시리즈기준)</span></h3>
            <div class="section-nav-btns" style="display: flex; gap: 0.5rem;">
                <button data-scroll-row-nav="dashboard-history-row" data-dir="left" class="btn-nav-arrow" data-i18n-title="common.prev" title="이전"><i class="fa-solid fa-chevron-left"></i></button>
                <button data-scroll-row-nav="dashboard-history-row" data-dir="right" class="btn-nav-arrow" data-i18n-title="common.next" title="다음"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
        <div class="dashboard-row-container" id="dashboard-history-row">
            <!-- JS에 의해 채워짐 -->
        </div>
    </div>

    <!-- 최근 읽은 도서 & 신규 추가 도서 사이 얇은 구분선 -->
    <hr style="border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 0.1rem 0;" />

    <!-- 2. 신규 추가 도서 섹션 -->
    <div class="dashboard-section">
        <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
            <h3 class="section-title" style="margin: 0; color: #fff; font-size: 1rem; font-weight: 700;"><i class="fa-solid fa-square-plus" style="color: #a855f7; margin-right: 0.5rem;"></i> <span id="dashboard-new-title" data-i18n="dashboard.new_books_title">신규 추가 도서</span></h3>
            <div class="section-nav-btns" style="display: flex; gap: 0.5rem;">
                <button data-scroll-row-nav="dashboard-new-row" data-dir="left" class="btn-nav-arrow" data-i18n-title="common.prev" title="이전"><i class="fa-solid fa-chevron-left"></i></button>
                <button data-scroll-row-nav="dashboard-new-row" data-dir="right" class="btn-nav-arrow" data-i18n-title="common.next" title="다음"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
        <div class="dashboard-row-container" id="dashboard-new-row">
            <!-- JS에 의해 채워짐 -->
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end; margin-top: 0.5rem; padding-bottom: 0;">
        <span style="font-size: 0.68rem; color: var(--boe-copyright-whisper-a17f3c9); letter-spacing: 0.04em; opacity: 0.9; user-select: none;">
            Copyright 2026 BookOasis Engine. All rights reserved.
        </span>
    </div>

</div>
