<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('app_dashboard_theme') || 'purple';
                document.documentElement.setAttribute('data-app-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090d16">
    <title>BookOasis - 도서 보관함</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ static_asset_url('images/logo.png', sig='boe-favicon-a17f3c9') }}">
    <!-- FontAwesome 아이콘 패키지 추가 (Local) -->
    <link rel="stylesheet" href="{{ static_asset_url('lib/font-awesome/css/all.min.css') }}">
    <!-- i18n 다국어 지원 엔진 -->
    <script src="{{ static_asset_url('js/i18n.js') }}"></script>
    <!-- Marked.js (Markdown 파서) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 외부 라이브러리 (로컬 다운로드 버전) -->
    <script src="{{ static_asset_url('lib/Sortable.min.js') }}"></script>
    <script>
        window.currentUser = {
            id: Number({{ session.get('user_id', 0) | tojson }}),
            username: {{ session.get('username', '') | tojson }},
            role: {{ session.get('role', '') | tojson }},
            has_adult_access: Number({{ session.get('has_adult_access', 0) | tojson }}),
            has_audiobook_access: Number({{ session.get('has_audiobook_access', 0) | tojson }})
        };
        window.bookOasisConsoleLog = typeof console.log === 'function' ? console.log.bind(console) : function() {};
        
        // 🌟 VIEW_LOG 환경변수에 따른 전역 콘솔 로그 제어 (Monkey Patch)
        window.VIEW_LOG = "{{ 'true' if view_log_enabled else 'false' }}" === "true";
        if (window.VIEW_LOG !== true) {
            console.log = function() {};
            console.warn = function() {};
        }
    </script>
    <!-- 프리미엄 커스텀 CSS -->
    
    <style>
        :root {
            --color-accent: {{ user_theme_color|default('#a855f7') }};
            --color-accent-hover: {{ user_theme_color|default('#a855f7') }}cc;
            --bg-glow-1: {{ user_theme_color|default('#a855f7') }}33;
            --bg-glow-2: #3b82f633;
            --bookoasis-engine-mark-a17f3c9: rgba(168, 85, 247, 0.12);
            --boe-copyright-whisper-a17f3c9: rgba(148, 163, 184, 0.72);
        }

        /* html 요소에도 overflow: hidden 필수 */
        html {
            overflow: hidden;
        }

        body {
            background-image: radial-gradient(circle at 15% 50%, var(--bg-glow-1), transparent 25%),
                radial-gradient(circle at 85% 30%, var(--bg-glow-2), transparent 25%);
            background-attachment: fixed;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            height: 100vh;          /* flex 자식의 높이 기준점 필수 */
            overflow: hidden;
            overscroll-behavior: none;
            display: flex;
            flex-direction: column;
        }
    </style>
    <script>
        window.bookOasisConsoleLog("%c📚 Powered by BookOasis Engine v1.0", "color: #a855f7; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 2px black; padding: 10px; border-radius: 5px; border: 2px solid #a855f7;");
        window.bookOasisConsoleLog("Licensed under GNU AGPLv3. https://github.com/leeyj/BookOasis_stable");
    </script>
</head>
<body>

<div class="main-wrapper">
    {% include "components/tab_media_library.html" %}
    {% include "components/modals/audio_player_modal.html" %}
</div>

<script type="module" src="{{ static_asset_url('js/dashboard_insights.js') }}"></script>
<script src="{{ static_asset_url('js/easter_egg_boss_key.js') }}"></script>

<script>
    // 페이지 로드 시 다국어 초기화 및 렌더링 실행
    document.addEventListener('DOMContentLoaded', async () => {
        await i18n.init();
        i18n.translateDOM();
        i18n.renderLanguageSelector('#settings-i18n-container');
        window.i18nReady = true;
        document.dispatchEvent(new Event('i18nReady'));
    });
</script>
</body>
</html>
