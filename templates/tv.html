<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
        (function() {
            try {
                var theme = localStorage.getItem('app_dashboard_theme') || 'purple';
                document.documentElement.setAttribute('data-app-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#090d16">
    <title>BookOasis TV</title>
    <link rel="icon" type="image/png" href="{{ static_asset_url('images/favicon.png', sig='boe-favicon-palm') }}">
    <link rel="stylesheet" href="{{ static_asset_url('lib/font-awesome/css/all.min.css') }}">
    <!-- 코어 UI 아이콘: Lucide 선 아이콘(FA는 플러그인·브랜드·채움 상태 아이콘용으로 계속 로드) -->
    <link rel="stylesheet" href="{{ static_asset_url('lib/lucide/lucide.css') }}">
    <script src="{{ static_asset_url('lib/lucide/fa_map.js') }}"></script>
    <script src="{{ static_asset_url('js/bo_icon.js') }}"></script>
    <link rel="stylesheet" href="{{ static_asset_url('css/tv.css') }}">
    <script>
        window.__tvUser = {{ ({'username': tv_username, 'role': tv_role} if tv_username else None) | tojson }};
    </script>
</head>
<body>

<button type="button" id="tv-drawer-toggle" class="tv-drawer-toggle" title="카테고리" data-i18n-title="tv.categories">
    <i class="lc lc-menu"></i>
</button>

<button type="button" id="tv-account-badge" class="tv-account-badge" title="계정" data-i18n-title="header.account">
    <i class="lc lc-user"></i>
    <span id="tv-account-name" data-i18n="tv.login">로그인</span>
</button>

<div id="tv-account-popup" class="tv-account-popup" style="display:none;">
    <div id="tv-account-popup-user" style="display:none;">
        <div class="tv-account-popup-row"><span id="tv-account-popup-username"></span></div>
        <button type="button" id="tv-account-logout-btn" class="tv-popup-btn"><i class="lc lc-log-out"></i> <span data-i18n="tv.logout">로그아웃</span></button>
    </div>
    <form id="tv-login-form" class="tv-login-form" style="display:none;">
        <input type="text" id="tv-login-username" class="tv-login-input" placeholder="아이디" data-i18n-placeholder="tv.username" autocomplete="username" required>
        <input type="password" id="tv-login-password" class="tv-login-input" placeholder="비밀번호" data-i18n-placeholder="tv.password" autocomplete="current-password" required>
        <div id="tv-login-error" class="tv-login-error" style="display:none;"></div>
        <button type="submit" class="tv-popup-btn tv-popup-btn-primary"><i class="lc lc-log-in"></i> <span data-i18n="tv.login">로그인</span></button>
    </form>
</div>

<div id="tv-drawer-scrim" class="tv-drawer-scrim"></div>

<div id="tv-drawer" class="tv-drawer">
    <div class="tv-drawer-header">
        <span class="tv-drawer-header-title"><i class="lc lc-book"></i> <span data-i18n="tv.categories">카테고리</span></span>
        <button type="button" id="tv-drawer-close" class="tv-drawer-close" title="닫기" data-i18n-title="common.close">
            <i class="lc lc-x"></i>
        </button>
    </div>
    <div class="tv-drawer-body">
        <button type="button" id="tv-drawer-home" class="tv-drawer-item active">
            <i class="lc lc-house"></i><span data-i18n="tv.home">홈</span>
        </button>
        <div id="tv-drawer-list" class="tv-drawer-list"></div>
    </div>
</div>

<main id="tv-main" class="tv-main">
    <div id="tv-home-view" class="tv-view">
        <section class="tv-row">
            <h2 class="tv-row-title"><i class="fa-solid fa-bookmark"></i> <span data-i18n="tv.continue">이어보기</span></h2>
            <div id="tv-row-history" class="tv-row-track"><div class="tv-row-loading" data-i18n="tv.loading">불러오는 중...</div></div>
        </section>
        <section class="tv-row">
            <h2 class="tv-row-title"><i class="fa-solid fa-star"></i> <span data-i18n="tv.recent">최근 추가</span></h2>
            <div id="tv-row-recent" class="tv-row-track"><div class="tv-row-loading" data-i18n="tv.loading">불러오는 중...</div></div>
        </section>
    </div>

    <div id="tv-category-view" class="tv-view" style="display:none;">
        <div class="tv-category-header">
            <h2 id="tv-category-title" class="tv-row-title"></h2>
            <button type="button" id="tv-sort-toggle" class="tv-sort-toggle">
                <i class="lc lc-arrow-down-a-z"></i>
                <span id="tv-sort-label" data-i18n="tv.sort_asc">가나다 오름차순</span>
            </button>
        </div>
        <div id="tv-category-grid" class="tv-grid"></div>
        <button type="button" id="tv-category-more" class="tv-load-more" style="display:none;" data-i18n="tv.more">더 보기</button>
    </div>
</main>

<script src="{{ static_asset_url('js/i18n.js') }}"></script>
<script src="{{ static_asset_url('js/tv.js') }}"></script>
</body>
</html>
